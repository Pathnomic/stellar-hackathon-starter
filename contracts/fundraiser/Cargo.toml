[package]
name = "fundraiser"
version = "1.0.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0"
description = "An escrow-style fundraising contract for Soroban: the money goes to the beneficiary if the goal is reached by the deadline, otherwise every supporter can take their own money back."

# Its own workspace root, so it never joins a Cargo workspace above it.
[workspace]

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=26.1.1"
stellar-access = "=0.7.2"
stellar-contract-utils = "=0.7.2"
stellar-macros = "=0.7.2"

[dev-dependencies]
soroban-sdk = { version = "=26.1.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
